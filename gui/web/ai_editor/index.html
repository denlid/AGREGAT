<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/input.css" />
    <link rel="stylesheet" href="css/preview.css" />

    <link rel="stylesheet" data-name="vs/editor/editor.main"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>

<body>
    <div id="top-bar">
        <div id="editor-title-container">
            <span id="editor-header-title" class="header-title">New strategy</span>
            <button id="editor-title-edit-btn" onclick="startEditingTitle()" title="Rename strategy" aria-label="Rename strategy">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
            </button>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <button id="restore-chat-btn" class="btn" onclick="toggleChatPanel()" aria-label="Toggle Chat"
                title="Toggle chat panel">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path
                        d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z" />
                </svg>
            </button>
        </div>
    </div>

    <div id="panels-row">
        <div id="editor-container">
            <div id="monaco-root">
                <div id="monaco-edit"></div>
            </div>
        </div>

        <div id="resizer"></div>

        <div id="chat-container">
            <div id="chat-tabs">
                <button id="chat-tab-add" class="chat-tab-add" title="New chat">+</button>
            </div>
            <div id="chat-history"></div>
            <div id="input-area">
                <div id="attachments-list"></div>
                <div id="input-pending-actions" class="input-pending-actions">
                    <button type="button" id="pending-apply-btn" class="btn apply-btn"
                        aria-label="Apply changes">Apply</button>
                    <button type="button" id="pending-reject-btn" class="btn apply-btn"
                        aria-label="Reject changes">Reject</button>
                </div>
                <div class="input-wrapper">
                    <div class="attach-wrap">
                        <button id="attach-btn" title="Attach" aria-label="Attach file">+</button>
                        <div id="attach-menu">
                            <button class="attach-item" id="attach-item-image">🖼 Photo</button>
                            <button class="attach-item" id="attach-item-doc">📄 Document</button>
                            <button class="attach-item" id="attach-item-chart">📐 Choose from chart</button>
                        </div>
                    </div>
                    <textarea id="chat-input" placeholder="Ask AI" aria-label="Chat input"></textarea>
                    <button type="button" id="action-btn" title="Send / Stop AI" aria-label="Send message">
                        <svg id="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                        <svg id="icon-stop" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"
                            style="display: none;">
                            <rect x="6" y="6" width="12" height="12"></rect>
                        </svg>
                        <svg id="icon-reload" viewBox="0 0 24 24" width="18" height="18" fill="none"
                            stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                            style="display: none;">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                            <path d="M21 3v6h-6"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="js/vendor_config.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.nls.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.js"></script>
        <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
        <script src="js/prelude.js"></script>
        <script src="js/state.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/editor.js"></script>
        <script src="js/chat.js"></script>
        <script src="js/bootstrap.js"></script>
</body>

</html>
