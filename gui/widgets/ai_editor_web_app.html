                    if (aiStreamChunkNum <= 10 || aiStreamChunkNum % 40 === 0) {
                        aiEditorDebug('stream_ai_chunk', {
                            n: aiStreamChunkNum,
                            chunkLen: (chunk || '').length,
                            cumulativeLen: currentAiMarkdown.length
                        });
                    }

                    scheduleStreamMarkdownFlush();
                };

                window.finish_ai_message = function (finalText) {
                    aiEditorDebug('finish_ai_message_begin', {
                        streamChunks: aiStreamChunkNum,
                        markdownLen: currentAiMarkdown.length,
                        finalArgLen: finalText != null ? String(finalText).length : 0,
                        filledFromFinal: !!(finalText && !currentAiMarkdown)
                    });

                    if (finalText && !currentAiMarkdown && finalText !== '__stopped__') {
                        currentAiMarkdown = String(finalText);
                    }

                    var hadContent = !!currentAiMarkdown;

                    // Save the final AI response to the active tab before clearing
                    if (hadContent) {
                        addMessageToActiveTab('assistant', currentAiMarkdown);
                    }

                    cancelStreamMarkdownFlush();

                    if (hadContent) {
                        applyStreamMarkdownFlush();
                    }

                    // FIND and update the placeholder if no content arrived (error/stop before first chunk)
                    if (!hadContent) {
                        var placeholderEl = chatHistory.querySelector('.ai-generating-root');
                        if (placeholderEl) {
                            var msgEl = placeholderEl.closest('.ai-message');
                            if (msgEl) {
                                if (finalText === '__stopped__') {
                                    msgEl.innerHTML = '<div style="font-size:11px;color:var(--text3);font-style:normal;padding:4px 0;">⏸ Stopped</div>';
                                } else if (finalText && String(finalText).indexOf('__error__:') === 0) {
                                    // Extract error text directly from the parameter
                                    var errText = String(finalText).slice(9); // remove '__error__:' prefix
                                    msgEl.innerHTML = '<div style="font-size:12px;color:var(--red);font-style:normal;padding:4px 0;">&#10060; ' + escapeHtml('Error: ' + errText) + '</div>';
                                } else {
                                    // Empty or falsy finalText (no content arrived from API) — show warning
                                    msgEl.innerHTML = '<div style="font-size:12px;color:var(--text2);font-style:normal;padding:8px 0;text-align:center;">'
                                        + '⚠️ AI повернуло порожню відповідь.<br>'
                                        + '<span style="font-size:11px;color:var(--text3);">Спробуйте переформулювати запит або перевірте консоль (F12 → Console) для деталей.</span>'
                                        + '</div>';
                                    aiEditorDebug('finish_ai_message_empty_response', {
                                        finalArgLen: finalText != null ? String(finalText).length : 0,
                                        streamChunks: aiStreamChunkNum
                                    });
                                }
                            }
                        }
                    }

                    currentAiMessageDiv = null;
                    currentAiMarkdown = '';
                    aiStreamChunkNum = 0;

                    setGeneratingState(false);
                    updatePendingActionsBar();

                    aiEditorDebug('finish_ai_message_done', {});
                    inputEl.focus();
                };

                window.on_ai_error = function (msg) {
                    aiEditorDebug('on_ai_error', {
                        msgLen: (msg != null ? String(msg).length : 0),
                        preview: String(msg || '').slice(0, 200)
                    });
                    addMessageToActiveTab('system', 'Error: ' + msg, { isError: true });
                    appendSystemMessage('Error: ' + msg, true);
                    window.finish_ai_message('__error__:' + (msg || ''));
                };

                window.set_editor_value = function (text) {
                    if (!isEditorReady()) return;
                    _suppressEditorDirty = true;
                    try {
                        if (safeEditorSetValue(text)) {
                            previewBaselineCode = getEditorValue();
                            pendingCodeCandidate = '';
                            pendingPatchChunks = null;
                            pendingPatchPreviewResult = null;
                            clearPreviewViewZones();
                            previewDecorations = editor.deltaDecorations(previewDecorations, []);
                            updatePendingActionsBar();
                        }
                    } finally {
                        setTimeout(function () { _suppressEditorDirty = false; }, 0);
                    }
                };

                window.set_editor_diagnostics = function (diagnostics) {
                    applyEditorDiagnostics(diagnostics);
                };

                window.apply_app_theme = function (theme) {
                    if (!theme) return;
                    const root = document.documentElement;
                    const map = {
                        bg: '--bg',
                        surface: '--surface',
                        elevated: '--elevated',
                        border: '--border',
                        accent: '--accent',
                        accentLight: '--accent-light',
                        text: '--text',
                        text2: '--text2',
                        text3: '--text3',
                        red: '--red',
                        green: '--green'
                    };
                    Object.keys(map).forEach(function (key) {
                        if (theme[key]) root.style.setProperty(map[key], theme[key]);
                    });
                    if (theme.monacoTheme) {
                        root.dataset.monacoTheme = theme.monacoTheme;
                    }
                    if (window.monaco && editor && theme.monacoTheme) {
                        monaco.editor.setTheme(theme.monacoTheme);
                    }
                };

                function notifyEditorDirty() {
                    if (_suppressEditorDirty) return;
                    if (_editorDiagnosticsTimer) {
                        clearTimeout(_editorDiagnosticsTimer);
                    }
                    _editorDiagnosticsTimer = setTimeout(function () {
                        _editorDiagnosticsTimer = 0;
                        if (pyBridge && typeof pyBridge.receive_editor_code_changed === 'function') {
                            pyBridge.receive_editor_code_changed(getEditorValue());
                        } else if (pyBridge && typeof pyBridge.receive_editor_dirty === 'function') {
                            pyBridge.receive_editor_dirty();
                        }
                    }, 250);
                    if (pyBridge && typeof pyBridge.receive_editor_dirty === 'function') {
                        pyBridge.receive_editor_dirty();
                    }
                }

                window.set_strategy_header_title = function (title) {
                    var el = document.getElementById('editor-header-title');
                    if (!el) {
                        // DOM not ready yet — retry once after microtask
                        var t = title;
                        setTimeout(function () {
                            var el2 = document.getElementById('editor-header-title');
                            if (el2) el2.textContent = (t && String(t).trim()) ? String(t).trim() : 'New strategy';
                        }, 0);
                        return;
                    }
                    el.textContent = (title && String(title).trim()) ? String(title).trim() : 'New strategy';
                };

                // ============= STRATEGY RENAME FUNCTIONS =============
                window.startEditingTitle = function () {
                    const titleSpan = document.getElementById('editor-header-title');
                    const container = document.getElementById('editor-title-container');
                    if (!titleSpan || !container) return;

                    const currentTitle = titleSpan.textContent.trim();
                    // Remove asterisk if present
                    const cleanTitle = currentTitle.replace(/\s*\*\s*$/, '');

                    // Create input element
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = 'editor-title-input';
                    input.value = cleanTitle;
                    input.className = 'header-title';

                    // Replace span with input
                    container.replaceChild(input, titleSpan);
                    input.focus();
                    input.select();

                    // Handle Enter key
                    input.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            finishEditingTitle(input, titleSpan);
                        } else if (e.key === 'Escape') {
                            e.preventDefault();
                            cancelEditingTitle(input, titleSpan);
                        }
                    });

                    // Handle blur (click outside)
                    input.addEventListener('blur', function () {
                        setTimeout(function () {
                            finishEditingTitle(input, titleSpan);
                        }, 100);
                    });
                };

                function finishEditingTitle(input, originalSpan) {
                    const container = document.getElementById('editor-title-container');
                    if (!container || !input.parentNode) return;

                    const newName = input.value.trim();
                    if (!newName) {
                        cancelEditingTitle(input, originalSpan);
                        return;
                    }

                    // Send to Python
                    if (safeBridgeCall('receive_rename_strategy', newName)) {
                        // Python will call set_strategy_header_title to update the UI
                        container.replaceChild(originalSpan, input);
                    } else {
                        cancelEditingTitle(input, originalSpan);
                    }
                }

                function cancelEditingTitle(input, originalSpan) {
                    const container = document.getElementById('editor-title-container');
                    if (!container || !input.parentNode) return;
                    container.replaceChild(originalSpan, input);
                }

                window.show_rename_error = function (msg) {
                    appendSystemMessage('Rename failed: ' + msg, true);
                };

                window.set_chat_input_text = function (text) {
                    inputEl.value = text || '';
                    inputEl.dispatchEvent(new Event('input'));
                    inputEl.focus();
                };

                window.set_chart_selection_context = function (payload) {
                    chartSelectionContext = payload;
                    appendSystemMessage('Chart area captured and attached to AI context.');
                };

                // Mirror-only: render to DOM without saving (sync is handled by chat_tabs_state)
                window.appendUserMessage = function (text) {
                    const escaped = (text || '').replace(/\n/g, '<br>');
                    chatHistory.innerHTML += `<div class="message user-message">${escaped}</div>`;
                    scrollChatToBottom();
                };

                window.appendAiMessage = function (fullText) {
                    if (!fullText) return;
                    const html = marked.parse(fullText);
                    chatHistory.innerHTML += `<div class="message ai-message">${html}</div>`;
                    scrollChatToBottom();
                };

                window.clear_chart_selection_context = function () {
                    chartSelectionContext = null;
                    appendSystemMessage('Chart area context cleared.');
                };

                window.toggleChatPanel = function () {
                    if (_panelCollapsed === 'chat' || !chatContainer.style.display || chatContainer.style.display === 'none') {
                        // Chat is hidden — restore it
                        _panelCollapsed = null;
                        chatContainer.style.display = 'flex';
                        chatContainer.style.width = ''; // reset to flex sizing
                        const total = window.innerWidth;
                        const restoreW = Math.min(CHAT_MIN + SNAP_THRESHOLD * 2, Math.floor(total * 0.35));
                        leftPanel.style.width = Math.max(EDITOR_MIN, total - restoreW) + 'px';
                    } else {
                        // Chat is visible — collapse it
                        _panelCollapsed = 'chat';
                        chatContainer.style.display = 'none';
                        leftPanel.style.width = '100%';
                    }
                    if (editor) setTimeout(() => editor.layout(), 50);
                };

                window.restoreEditorPanel = function () {
                    // Restore editor panel from collapsed state
                    if (_panelCollapsed === 'editor') {
                        _panelCollapsed = null;
                        leftPanel.style.display = 'flex';
                        const total = window.innerWidth;
                        const restoreW = Math.min(EDITOR_MIN + SNAP_THRESHOLD * 2, Math.floor(total * 0.65));
                        leftPanel.style.width = restoreW + 'px';
                        chatContainer.style.width = ''; // reset to flex sizing
                        if (editor) setTimeout(() => editor.layout(), 50);
                    }
                };

                window.set_chat_only_mode = function (enabled) {
                    const editorContainer = document.getElementById('editor-container');
                    const resizerEl = document.getElementById('resizer');
                    const chatContainerEl = document.getElementById('chat-container');
                    const topBar = document.getElementById('top-bar');

                    if (enabled) {
                        editorContainer.style.display = 'none';
                        resizerEl.style.display = 'none';
                        chatContainerEl.style.width = '100%';
                        if (topBar) topBar.style.display = 'none';
                    } else {
                        editorContainer.style.display = 'flex';
                        resizerEl.style.display = 'block';
                        chatContainerEl.style.width = 'auto';
                        if (topBar) topBar.style.display = 'flex';
                    }

                    if (editor) {
                        setTimeout(() => editor.layout(), 100);
                    }
                };

                window.append_ai_error_ask = function (traceback) {
                    addMessageToActiveTab('user', 'Fix this error:\n' + traceback);
                    const escapedTraceback = escapeHtml(traceback);
                    chatHistory.innerHTML += `<div class="message user-message">Fix this error:<br><pre style="background:var(--bg);padding:8px;border-radius:4px;overflow-x:auto;">${escapedTraceback}</pre></div>`;

                    currentAiMessageDiv = document.createElement('div');
                    currentAiMessageDiv.className = 'message ai-message';
                    currentAiMessageDiv.innerHTML = buildGeneratingPlaceholderHtml('Auto-fix…');
                    chatHistory.appendChild(currentAiMessageDiv);

                    currentAiMarkdown = '';
                    scrollChatToBottom();
                    setGeneratingState(true);

                    previewBaselineCode = getEditorValue();
                    pendingCodeCandidate = '';
                    pendingPatchChunks = null;
                    pendingPatchPreviewResult = null;
                    updatePendingActionsBar();
                };

                window.saveStrategy = function () {
                    safeBridgeCall('receive_save_strategy', getEditorValue());
                };

                window.applyCodeToEditor = function (btn) {
                    const rawCodeEl = btn.parentElement.nextElementSibling.querySelector('.raw-code');
                    if (rawCodeEl && isEditorReady()) {
                        let code = rawCodeEl.value;
                        const txt = document.createElement('textarea');
                        txt.innerHTML = code;
                        code = txt.value;

                        previewBaselineCode = getEditorValue();

                        if (safeEditorSetValue(code)) {
                            pendingCodeCandidate = '';
                            pendingPatchChunks = null;
                            pendingPatchPreviewResult = null;
                            clearPreviewViewZones();
                            previewDecorations = editor.deltaDecorations(previewDecorations, []);
                            appendSystemMessage('Code pasted into editor.');
                            updatePendingActionsBar();
                        }
                    }
                };

                // ============= INITIALIZATION =============
                function initEditor() {
                    try {
                        editor = monaco.editor.create(monacoEditEl, {
                            value: [
                                'from engine.strategy.context import Strategy',
                                '',
                                'class AIStrategy(Strategy):',
                                '    name = "AI Strategy"',
                                '    ',
                                '    def on_candle(self, ctx):',
                                '        pass'
                            ].join('\n'),
                            language: 'python',
                            theme: (document.documentElement.dataset.monacoTheme || 'vs-dark'),
                            automaticLayout: true,
                            minimap: { enabled: true },
                            fontSize: 13,
                            fontFamily: "'Roboto Mono', Consolas, monospace",
                            scrollBeyondLastLine: false,
                            padding: { top: 15 },
                            // QtWebEngine optimizations
                            renderWhitespace: 'none',
                            renderControlCharacters: false,
                            renderIndentGuides: false,
                            'semanticHighlighting.enabled': true,
                            smoothScrolling: false,
                            cursorBlinking: 'solid',
                            cursorSmoothCaretAnimation: false
                        });

                        editor.onDidChangeModelContent(function () {
                            notifyEditorDirty();
                        });

                        // Force initial layout for QtWebEngine
                        setTimeout(() => {
                            if (editor) {
                                editor.layout();
                                editor.revealLine(1);
                            }
                        }, 50);

                        // Additional resize observer for reliability
                        if (window.ResizeObserver) {
                            const ro = new ResizeObserver(() => {
                                if (editor) editor.layout();
                            });
                            ro.observe(monacoEditEl);
                        }

                        console.log('Monaco Editor initialized successfully');
                        return true;
                    } catch (e) {
                        console.error('Failed to initialize Monaco Editor:', e);
                        return false;
                    }
                }

                function initBridge() {
                    if (typeof QWebChannel === 'undefined') {
                        console.warn('QWebChannel not loaded, retrying...');
                        setTimeout(initBridge, 200);
                        return;
                    }

                    try {
                        new QWebChannel(qt.webChannelTransport, function (channel) {
                            pyBridge = channel.objects.bridge;
                            bridgeReady = true;

                            if (isEditorReady()) {
                                pyBridge.editor_ready();
                                aiEditorDebug('webchannel_ready', { editorReady: true });
                            } else {
                                aiEditorDebug('webchannel_ready', { editorReady: false });
                                // Editor might still be loading, Python side should handle this
                                setTimeout(() => {
                                    if (isEditorReady()) {
                                        pyBridge.editor_ready();
                                    }
                                }, 300);
                            }
                        });
                    } catch (e) {
                        console.error('QWebChannel initialization failed:', e);
                        setTimeout(initBridge, 500);
                    }
                }

                function handleAction() {
                    if (isGenerating) {
                        stopAI();
                    } else {
                        sendMessage();
                    }
                }

                function setupEventListeners() {
                    // Action button
                    actionBtn.addEventListener('mousedown', function (ev) {
                        if (isGenerating) {
                            ev.stopPropagation();
                            stopAI();
                        }
                    }, true);

                    actionBtn.addEventListener('click', function (e) {
                        e.preventDefault();
                        handleAction();
                    });

                    // Input handling
                    inputEl.addEventListener('input', function () {
                        this.style.height = '24px';
                        this.style.height = (this.scrollHeight) + 'px';
                    });

                    inputEl.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            handleAction();
                        }
                    });

                    // Attach menu
                    attachBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        attachMenu.classList.toggle('open');
                    });

                    window.addEventListener('click', function () {
                        attachMenu.classList.remove('open');
                    });

                    // Chat tabs — add button
                    document.getElementById('chat-tab-add').addEventListener('click', function () {
                        createChatTab();
                    });

                    // Pending actions
                    document.getElementById('pending-apply-btn').addEventListener('click', applyPendingChanges);
                    document.getElementById('pending-reject-btn').addEventListener('click', rejectPendingCodePreview);

                    // Attach menu items
                    document.getElementById('attach-item-image').addEventListener('click', function () { requestAttachment('image'); });
                    document.getElementById('attach-item-doc').addEventListener('click', function () { requestAttachment('document'); });
                    document.getElementById('attach-item-chart').addEventListener('click', function () { requestAttachment('chart'); });

                    // Resizer — collapsible editor/chat panels (like Chart tab QSplitter)
                    let isResizing = false;

                    resizer.addEventListener('mousedown', () => {
                        isResizing = true;
                        resizer.classList.add('active');
                        document.body.style.cursor = 'col-resize';
                        // Panel stays collapsed on mousedown — only restores on mousemove past threshold
                    });

                    window.addEventListener('mousemove', (e) => {
                        if (!isResizing) return;
                        const total = window.innerWidth;
                        const edW = e.clientX;
                        const chatW = total - edW;

                        if (_panelCollapsed === 'chat') {
                            // Chat is hidden; restore only when dragged far enough (intended chat > CHAT_MIN + SNAP_THRESHOLD)
                            if (chatW > CHAT_MIN + SNAP_THRESHOLD) {
                                _panelCollapsed = null;
                                chatContainer.style.display = 'flex';
                                leftPanel.style.width = Math.max(EDITOR_MIN, total - chatW) + 'px';
                            }
                        } else if (_panelCollapsed === 'editor') {
                            // Editor is hidden; restore only when dragged far enough
                            if (edW > EDITOR_MIN + SNAP_THRESHOLD) {
                                _panelCollapsed = null;
                                leftPanel.style.display = 'flex';
                                chatContainer.style.width = ''; // reset to flex sizing
                                leftPanel.style.width = Math.max(EDITOR_MIN, Math.min(total - CHAT_MIN, edW)) + 'px';
                            }
                        } else {
                            // Normal resize — stick at minimum boundary before collapsing
                            if (chatW < CHAT_MIN) {
                                // Keep chat at minimum width, don't collapse immediately
                                let overscroll = CHAT_MIN - chatW;
                                if (overscroll > SNAP_THRESHOLD) {
                                    // Dragged far enough past minimum → collapse
                                    _panelCollapsed = 'chat';
                                    chatContainer.style.display = 'none';
                                    leftPanel.style.width = '100%';
                                } else {
                                    // Stick at minimum width (like hitting a wall)
                                    leftPanel.style.width = (total - CHAT_MIN) + 'px';
                                }
                            } else if (edW < EDITOR_MIN) {
                                // Keep editor at minimum width, don't collapse immediately
                                let overscroll = EDITOR_MIN - edW;
                                if (overscroll > SNAP_THRESHOLD) {
                                    // Dragged far enough past minimum → collapse
                                    _panelCollapsed = 'editor';
                                    leftPanel.style.display = 'none';
                                    chatContainer.style.width = '100%';
                                } else {
                                    // Stick at minimum width
                                    leftPanel.style.width = EDITOR_MIN + 'px';
                                }
                            } else {
                                // Normal resize within bounds
                                leftPanel.style.width = Math.max(EDITOR_MIN, Math.min(total - CHAT_MIN, edW)) + 'px';
                            }
                        }
                        if (editor) editor.layout();
                    });

                    window.addEventListener('mouseup', () => {
                        if (isResizing) {
                            isResizing = false;
                            resizer.classList.remove('active');
                            document.body.style.cursor = 'default';
                            if (editor) editor.layout();
                        }
                    });

                    // Global error handling
                    window.addEventListener('error', function (e) {
                        console.error('JS Error:', e.message, e.filename, e.lineno, e.error);
                    });
                }

                // ============= MARKED CONFIGURATION =============
                function configureMarked() {
                    marked.setOptions({
                        highlight: function (code, lang) {
                            if (lang && hljs.getLanguage(lang)) {
                                try {
                                    return hljs.highlight(code, { language: lang }).value;
                                } catch (e) { }
                            }
                            try {
                                return hljs.highlightAuto(code).value;
                            } catch (e) { }
                            return escapeHtml(code);
                        },
                        breaks: true,
                        gfm: true
                    });

                    const renderer = new marked.Renderer();
                    renderer.code = function (code, lang) {
                        const validLang = !!(lang && hljs.getLanguage(lang));
                        let highlighted;

                        try {
                            highlighted = validLang
                                ? hljs.highlight(code, { language: lang }).value
                                : hljs.highlightAuto(code).value;
                        } catch (e) {
                            highlighted = escapeHtml(code);
                        }

                        const escapedCode = code
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;')
                            .replace(/"/g, '&quot;')
                            .replace(/'/g, '&#39;');

                        return `
                    <div class="code-header">
                        <span>${escapeHtml(lang || 'python')}</span>
                        <button class="btn apply-btn" onclick="applyCodeToEditor(this)">
                            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                            </svg>
                            Apply to Editor
                        </button>
                    </div>
                    <pre><code class="hljs ${escapeHtml(lang)}">${highlighted}</code><textarea style="display:none;" class="raw-code">${escapedCode}</textarea></pre>
                `;
                    };

                    marked.use({ renderer });
                }

                // ============= MAIN INITIALIZATION =============
                function bootstrap() {
                    configureMarked();

                    // Initialize chat tabs (loads from localStorage or creates default)
                    initChatTabs();

                    require(['vs/editor/editor.main'], function () {
                        const editorInitialized = initEditor();

                        if (editorInitialized) {
                            setupEventListeners();
                            initBridge();
                        } else {
                            document.getElementById('monaco-edit').innerHTML =
                                '<div style="color:var(--red);padding:20px;">Failed to initialize editor. Please restart the application.</div>';
                        }
                    });
                }

                // Start when DOM is ready
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', bootstrap);
                } else {
                    bootstrap();
                }

            })();
        </script>
</body>

</html>
