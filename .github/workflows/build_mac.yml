name: Build AGREGAT for macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [x86_64, arm64]
    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps
        run: |
          brew install create-dmg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard pillow

      - name: Run build script
        run: |
          chmod +x build_macos.sh package_macos.sh
          ./build_macos.sh --arch ${{ matrix.arch }}

      - name: Package .pkg and .dmg
        run: |
          ./package_macos.sh

      - name: Upload .pkg installer
        uses: actions/upload-artifact@v4
        with:
          name: AGREGAT-${{ matrix.arch }}-pkg
          path: dist/installers/*.pkg

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: AGREGAT-${{ matrix.arch }}-dmg
          path: dist/installers/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
